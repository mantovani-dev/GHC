<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Limpando o site…</title>

    <!--
      Página de resgate para quem ficou preso numa versão antiga.

      Quem visitou o site em agosto/setembro guardou um Service Worker que
      intercepta a navegação e serve a página de então, com arquivos que já
      não existem. Como ele responde do cache, nenhuma correção publicada
      depois chega até lá — o site não tinha como se curar sozinho.

      O endereço /api/ é a brecha: o Service Worker daquela época foi
      configurado para NÃO atender navegações sob /api/ (navigateFallback-
      Denylist), então este pedido alcança a rede de verdade.

      A resposta carrega o cabeçalho Clear-Site-Data (definido no
      vercel.json), que manda o navegador apagar cache, armazenamento e os
      Service Workers desta origem.
    -->
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0b0e14;
        color: #e8ecf4;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .caixa { max-width: 30rem; display: grid; gap: 18px; }
      h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
      p { margin: 0; font-size: 15px; line-height: 1.6; color: rgba(232, 236, 244, 0.65); }
      a {
        justify-self: center;
        margin-top: 6px;
        padding: 14px 26px;
        border-radius: 999px;
        background: #33bae9;
        color: #04141c;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div class="caixa">
      <h1>Pronto, limpamos o site no seu aparelho</h1>
      <p>
        Você estava vendo uma versão antiga guardada no navegador. Já
        apagamos — é só voltar.
      </p>
      <a href="https://www.globalhiring.com.br/">Abrir o site</a>
    </div>

    <script>
      /* Reforço: se o navegador ignorar o cabeçalho (o suporte varia entre
         Safari e Chrome), fazemos a mesma limpeza pela API. */
      (function () {
        try {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) {
                r.unregister();
              });
            });
          }
          if (window.caches) {
            caches.keys().then(function (chaves) {
              chaves.forEach(function (k) {
                caches.delete(k);
              });
            });
          }
        } catch (e) {}
      })();
    </script>
  </body>
</html>
