<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e14" />

    <!--
      Fontes: um unico pedido, descoberto ja no HTML.
      Antes eram tres @import no topo do index.css, o que obrigava o
      navegador a baixar e interpretar o CSS inteiro antes de sequer saber
      que precisava das fontes - uma cascata em serie antes do primeiro
      desenho. O preconnect abre a conexao com o Google em paralelo.
      Pesos: so os que o site usa (sem o 300 e sem italicos).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    />

    <!-- Cache control: garante que o browser nunca guarde este HTML -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!--
      title, description, og:*, canonical e o JSON-LD de JobPosting são
      injetados pelo plugin `ghc-seo-tags` em vite.config.ts, a partir de
      src/data/vacancies.ts. Não adicione essas tags aqui à mão — elas
      apareceriam duplicadas.
    -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
