<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e14" />

    <!-- Cache control: garante que o browser nunca guarde este HTML -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!--
      title, description, og:*, canonical e o JSON-LD de JobPosting são
      injetados pelo plugin `ghc-seo-tags` em vite.config.ts, a partir de
      src/data/vacancies.ts. Não adicione essas tags aqui à mão — elas
      apareceriam duplicadas.
    -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
