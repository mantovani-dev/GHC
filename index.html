<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e14" />

    <!--
      Limpeza de estado herdado. Fica aqui, inline no HTML, de proposito.

      Versoes anteriores deste site instalaram um Service Worker. Quando os
      nomes com hash dos arquivos mudaram, esses clientes passaram a pedir
      arquivos que nao existem mais e a pagina parava de subir. A limpeza nao
      podia morar no pacote JavaScript: nos aparelhos travados e exatamente
      o pacote que nao carrega, entao o codigo que cura nunca rodava.

      Aqui ela roda sempre, antes de tudo, sem depender de nada. Em quem nao
      tem Service Worker, nao faz absolutamente nada.

      A trava em sessionStorage garante um unico recarregamento por sessao,
      para nao virar um laco.
    -->
    <script>
      (function () {
        try {
          var temSW = "serviceWorker" in navigator;

          var limpaSW = temSW
            ? navigator.serviceWorker
                .getRegistrations()
                .then(function (regs) {
                  return Promise.all(
                    regs.map(function (r) {
                      return r.unregister();
                    })
                  ).then(function () {
                    return regs.length > 0;
                  });
                })
                .catch(function () {
                  return false;
                })
            : Promise.resolve(false);

          var limpaCache = window.caches
            ? caches
                .keys()
                .then(function (chaves) {
                  return Promise.all(
                    chaves.map(function (k) {
                      return caches.delete(k);
                    })
                  ).then(function () {
                    return chaves.length > 0;
                  });
                })
                .catch(function () {
                  return false;
                })
            : Promise.resolve(false);

          Promise.all([limpaSW, limpaCache])
            .then(function (removeu) {
              if (!removeu[0] && !removeu[1]) return;
              if (sessionStorage.getItem("ghc-limpo")) return;
              sessionStorage.setItem("ghc-limpo", "1");
              location.reload();
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>


    <!--
      Fontes servidas pelo nosso domínio (public/fonts), com as @font-face
      dentro do nosso próprio CSS. Antes vinham de servidores do Google:
      uma ida para buscar a folha de estilo e OUTRA, em domínio diferente,
      para os arquivos .woff2 — cada uma com DNS e TLS próprios. No celular
      isso atrasava a troca de fonte por segundos, e era o texto "se
      ajeitando" depois de a página já ter aparecido.

      Só os dois pesos mais usados são pré-carregados: o 400 do corpo e o
      600 dos títulos. Os outros o navegador busca ao topar com a regra.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-400-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-600-latin.woff2" crossorigin />

    <!-- Cache control: garante que o browser nunca guarde este HTML -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!--
      title, description, og:*, canonical e o JSON-LD de JobPosting são
      injetados pelo plugin `ghc-seo-tags` em vite.config.ts, a partir de
      src/data/vacancies.ts. Não adicione essas tags aqui à mão — elas
      apareceriam duplicadas.
    -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
