<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e14" />

    <!--
      Fontes servidas pelo nosso domínio (public/fonts), com as @font-face
      dentro do nosso próprio CSS. Antes vinham de servidores do Google:
      uma ida para buscar a folha de estilo e OUTRA, em domínio diferente,
      para os arquivos .woff2 — cada uma com DNS e TLS próprios. No celular
      isso atrasava a troca de fonte por segundos, e era o texto "se
      ajeitando" depois de a página já ter aparecido.

      Só os dois pesos mais usados são pré-carregados: o 400 do corpo e o
      600 dos títulos. Os outros o navegador busca ao topar com a regra.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-400-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-600-latin.woff2" crossorigin />

    <!-- Cache control: garante que o browser nunca guarde este HTML -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!--
      Entrada de HTML da rota /vagas. Existe para que o quadro de vagas tenha
      o seu próprio <head>: título, description, canonical e os 25 JSON-LD de
      JobPosting, que ficam só aqui e não na home.

      Essas tags são injetadas pelo plugin `ghc-seo-tags` em vite.config.ts, a
      partir de src/data/vacancies.ts. Não as adicione aqui à mão.

      O app React é o mesmo do index.html — o react-router é quem decide o que
      renderizar a partir da URL.
    -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
