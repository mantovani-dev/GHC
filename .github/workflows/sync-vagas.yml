name: Sincronizar vagas com a planilha

# A cada 30 minutos lê a planilha de controle, valida e — só se algo mudou —
# commita src/data/vacancies.generated.ts. O push dispara o build do Netlify,
# que republica /vagas com os JSON-LD atualizados.
#
# Se a planilha tiver qualquer problema, o job falha e NADA é commitado: o
# site anterior continua no ar e você recebe o e-mail de falha do GitHub.
#
# Requer o secret VAGAS_XLSX_URL com o link de compartilhamento da planilha.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      apenas_verificar:
        description: "Só validar a planilha, sem commitar"
        type: boolean
        default: false

concurrency:
  group: sync-vagas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Ler a planilha e gerar o arquivo de vagas
        env:
          VAGAS_XLSX_URL: ${{ secrets.VAGAS_XLSX_URL }}
        run: |
          if [ -z "$VAGAS_XLSX_URL" ]; then
            echo "::error::secret VAGAS_XLSX_URL não está configurado"
            exit 1
          fi
          node scripts/sync-vacancies.mjs \
            ${{ inputs.apenas_verificar && '--check' || '' }}

      - name: Conferir se o site ainda compila
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npm run build

      - name: Commitar se mudou
        if: ${{ !inputs.apenas_verificar }}
        run: |
          if git diff --quiet -- src/data/vacancies.generated.ts; then
            echo "nada mudou — sem commit"
            exit 0
          fi

          quantas=$(grep -c '^    code: ' src/data/vacancies.generated.ts)

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/vacancies.generated.ts
          git commit -m "chore(vagas): sincroniza quadro com a planilha ($quantas vagas)

          Gerado por scripts/sync-vacancies.mjs a partir da planilha de
          controle. Não edite src/data/vacancies.generated.ts à mão."
          git push
